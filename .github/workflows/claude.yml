name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      github.actor != 'claude[bot]' &&
      (contains(github.event.comment.body, '@claude') || contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--append-system-prompt 'Antworte in allen Kommentaren und Pull-Request-Beschreibungen ausschliesslich auf Deutsch.'"

      - name: Bei Fehler Kommentar ins Issue schreiben
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number || context.payload.issue?.number;
            if (!issue_number) return;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `⚠️ **Claude ist bei der Bearbeitung dieses Issues abgebrochen.**\n\nDer Lauf ist fehlgeschlagen. Details zum Fehler findest du im Log:\n${runUrl}\n\nBitte prüfe die Konfiguration oder kommentiere erneut mit @claude, sobald das Problem behoben ist.`
            });
